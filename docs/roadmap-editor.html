<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yomu Re:Dive — Roadmap Editor</title>
<style>
  /* ============================================================
     ROADMAP STYLES (self-contained on .page — used by preview,
     PNG export, and the exported standalone HTML). Keep in sync
     with docs/roadmap.png. Do not use these class names for the
     editor chrome (those are prefixed .ed-).
     ============================================================ */
  #rm-css-marker{display:none}
  .page{
    position:relative; width:900px; min-height:400px; padding:48px 52px 44px;
    box-sizing:border-box; color:#1E2228;
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(720px 360px at 98% -4%, rgba(232,32,42,0.10), rgba(232,32,42,0) 60%),
      #FAFBFC;
  }
  .page *{ box-sizing:border-box; }
  .head{ display:flex; align-items:center; gap:16px; }
  .logo{ width:52px; height:52px; border-radius:15px; border:3.5px solid #1E2228;
    background:linear-gradient(180deg,#FFFFFF 0 56%, #E8202A 56% 100%);
    box-shadow:0 6px 15px rgba(30,34,40,.12); flex:none; }
  .app{ font-size:32px; font-weight:800; color:#1E2228; letter-spacing:-.4px; line-height:1; }
  .app .re{ color:#E8202A; }
  .kicker{ margin-top:7px; font-size:13.5px; font-weight:600; color:#6B7280; letter-spacing:2.4px; text-transform:uppercase; }
  .legend{ display:flex; flex-wrap:wrap; gap:20px; margin-top:20px; }
  .lg{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; color:#4A4E55; }
  .ld{ width:12px; height:12px; border-radius:50%; }
  .ld.done{ background:#2EA043; }
  .ld.now{ background:#E8202A; }
  .ld.plan{ background:#fff; border:2.5px solid #64748B; }
  .ld.future{ background:#fff; border:2.5px dashed #B6BCC6; }
  .rule{ height:1px; background:#E7E9ED; margin:20px 0 0; }

  .timeline{ position:relative; margin-top:26px; }
  .ms{ position:relative; padding-left:74px; padding-bottom:24px; }
  .ms.last{ padding-bottom:0; }
  .conn{ position:absolute; left:24px; top:24px; bottom:-25px; width:4px; border-radius:4px; z-index:1; }
  .conn.green{ background:#2EA043; }
  .conn.grey{ background:#DFE2E7; }
  .conn.dash{ background:repeating-linear-gradient(180deg,#C9CDD3 0 8px, transparent 8px 15px); }

  .node{ position:absolute; left:11px; top:10px; width:30px; height:30px; border-radius:50%; background:#fff;
    z-index:2; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 9px rgba(30,34,40,.16); }
  .node.done{ background:#2EA043; }
  .node.done::after{ content:""; width:9px; height:15px; border:solid #fff; border-width:0 3.5px 3.5px 0; transform:translateY(-1px) rotate(45deg); }
  .node.now{ background:#E8202A; box-shadow:0 0 0 6px rgba(232,32,42,.15), 0 3px 9px rgba(232,32,42,.35); }
  .node.now::after{ content:""; width:10px; height:10px; border-radius:50%; background:#fff; }
  .node.plan{ border:3px solid #64748B; }
  .node.plan::after{ content:""; width:8px; height:8px; border-radius:50%; background:#64748B; }
  .node.future{ border:3px dashed #B6BCC6; }

  .card{ background:#fff; border:1px solid #E7E9ED; border-left-width:5px; border-radius:14px;
    padding:16px 20px 18px; box-shadow:0 10px 26px rgba(30,34,40,.06); position:relative; }
  .card.done{ border-left-color:#2EA043; }
  .card.now{ border-left-color:#E8202A; }
  .card.plan{ border-left-color:#64748B; }
  .card.future{ border-left-color:#C4CAD3; border-left-style:dashed; background:#FCFCFD; }

  .toprow{ display:flex; align-items:center; justify-content:space-between; }
  .ver{ font-size:21px; font-weight:800; color:#1E2228; letter-spacing:-.3px; }
  .card.future .ver{ color:#64748B; }
  .chip{ font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:5px 11px; border-radius:999px; }
  .chip.done{ background:rgba(46,160,67,.12); color:#1F7A33; }
  .chip.now{ background:rgba(232,32,42,.12); color:#C21620; }
  .chip.plan{ background:rgba(100,116,139,.14); color:#4B5563; }
  .chip.future{ background:rgba(100,116,139,.10); color:#7A828F; }
  .title{ font-size:19px; font-weight:750; color:#1E2228; line-height:1.25; margin-top:8px; }
  .card.future .title{ color:#5A616B; }

  .changes{ margin-top:14px; }
  .change{ display:flex; gap:11px; align-items:flex-start; margin-top:9px; }
  .change.first{ margin-top:0; }
  .tag{ flex:none; font-size:10.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
    padding:3px 0; width:78px; text-align:center; border-radius:6px; margin-top:2px; background:#EEF0F3; color:#555; }
  .tag.Added{ background:rgba(46,160,67,.12); color:#1F7A33; }
  .tag.Revamp{ background:rgba(232,32,42,.12); color:#C21620; }
  .tag.Fixed{ background:rgba(31,111,235,.12); color:#1858C7; }
  .tag.Removed{ background:rgba(180,83,9,.14); color:#9A4A0C; }
  .ctext{ font-size:14.5px; line-height:1.45; color:#3B3F46; padding-top:1px; }
  .summary{ margin-top:14px; font-size:13.5px; line-height:1.55; color:#7A828C; font-style:italic; }
  .summary.divided{ padding-top:12px; border-top:1px solid #E7E9ED; }
  .foot{ margin-top:30px; display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:#9AA0A9; }
  .foot .gh{ font-weight:600; color:#7A828F; }

  /* ============================================================
     EDITOR CHROME (.ed-*)
     ============================================================ */
  :root{ --red:#E8202A; --ink:#1E2228; --line:#E5E7EB; --bg:#F4F5F7; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  .ed-top{ position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 20px; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 2px 8px rgba(0,0,0,.03); }
  .ed-brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; margin-right:auto; }
  .ed-mark{ width:26px; height:26px; border-radius:8px; border:2.5px solid var(--ink);
    background:linear-gradient(180deg,#fff 0 56%, var(--red) 56% 100%); }
  .ed-brand .re{ color:var(--red); }
  .ed-btn{ font:inherit; font-size:13.5px; font-weight:600; padding:8px 14px; border-radius:9px; border:1px solid var(--line);
    background:#fff; color:#374151; cursor:pointer; }
  .ed-btn:hover{ background:#F9FAFB; }
  .ed-btn.primary{ background:var(--red); border-color:var(--red); color:#fff; }
  .ed-btn.primary:hover{ background:#cf1a23; }
  .ed-btn.ghost{ border-style:dashed; }

  .ed-main{ display:grid; grid-template-columns:minmax(420px,1fr) minmax(440px,1fr); gap:22px; padding:22px; align-items:start; }
  @media (max-width:980px){ .ed-main{ grid-template-columns:1fr; } }

  .ed-panel{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; }
  .ed-h{ font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#6B7280; margin:2px 0 12px; }

  .ed-field{ margin-bottom:12px; }
  .ed-field label{ display:block; font-size:12.5px; font-weight:600; color:#4B5563; margin-bottom:5px; }
  .ed-field input, .ed-field select, .ed-field textarea{ width:100%; font:inherit; font-size:14px; padding:8px 10px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .ed-field textarea{ resize:vertical; min-height:60px; line-height:1.45; }
  .ed-row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .ed-ms{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:14px; background:#FCFCFD; }
  .ed-ms-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .ed-ms-title{ font-weight:800; font-size:15px; }
  .ed-dot{ width:11px; height:11px; border-radius:50%; }
  .ed-ms-tools{ margin-left:auto; display:flex; gap:6px; }
  .ed-icon{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer;
    font-size:15px; line-height:1; color:#4B5563; }
  .ed-icon:hover{ background:#F3F4F6; }
  .ed-icon.del:hover{ background:#FDECEC; color:#c0202a; border-color:#f3c9cc; }

  .ed-changes{ margin-top:4px; }
  .ed-clabel{ font-size:12.5px; font-weight:600; color:#4B5563; margin-bottom:6px; }
  .ed-change{ display:grid; grid-template-columns:120px 1fr 30px; gap:8px; margin-bottom:7px; }
  .ed-change input, .ed-change select{ font:inherit; font-size:13.5px; padding:7px 8px; border:1px solid var(--line); border-radius:7px; background:#fff; }
  .ed-addchange{ font-size:12.5px; font-weight:600; color:var(--red); background:none; border:none; cursor:pointer; padding:4px 0; }

  .ed-preview-wrap{ position:sticky; top:78px; }
  .ed-canvas{ position:relative; width:100%; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:#FAFBFC; }
  .ed-canvas .page{ position:absolute; top:0; left:0; }
  .ed-hint{ font-size:12px; color:#8A909A; margin-top:10px; line-height:1.5; }
  .ed-file{ display:none; }
  .ed-status{ display:inline-block; font-size:12px; color:#8A909A; margin-left:4px; }
</style>
</head>
<body>
  <div class="ed-top">
    <div class="ed-brand"><span class="ed-mark"></span>Yomu <span class="re">Re:Dive</span>&nbsp;· Roadmap Editor</div>
    <button class="ed-btn primary" id="btnPng">⬇ Download PNG</button>
    <button class="ed-btn" id="btnHtml">⬇ HTML</button>
    <button class="ed-btn" id="btnJson">⬇ JSON</button>
    <button class="ed-btn" id="btnImport">⬆ Import JSON</button>
    <button class="ed-btn ghost" id="btnReset">↺ Reset</button>
    <span class="ed-status" id="status"></span>
    <input type="file" class="ed-file" id="fileJson" accept="application/json,.json">
  </div>

  <div class="ed-main">
    <div>
      <div class="ed-panel" style="margin-bottom:18px">
        <div class="ed-h">Header &amp; footer</div>
        <div class="ed-row2">
          <div class="ed-field"><label>App name</label><input id="fAppName"></div>
          <div class="ed-field"><label>Subtitle</label><input id="fSubtitle"></div>
        </div>
        <div class="ed-row2">
          <div class="ed-field"><label>Footer note (left)</label><input id="fFootNote"></div>
          <div class="ed-field"><label>Footer text (right)</label><input id="fFootRight"></div>
        </div>
      </div>

      <div class="ed-panel">
        <div class="ed-h">Milestones</div>
        <div id="msList"></div>
        <button class="ed-btn ghost" id="btnAdd" style="width:100%">＋ Add milestone</button>
      </div>
    </div>

    <div class="ed-preview-wrap">
      <div class="ed-panel">
        <div class="ed-h">Live preview</div>
        <div class="ed-canvas" id="canvas"><div id="previewHost" style="display:none"></div></div>
        <div class="ed-hint">
          The preview matches the exported PNG exactly. <b>Download PNG</b> renders at 2× (1800&nbsp;px wide) — works best in
          Chrome or Edge. Your work autosaves in this browser; use <b>JSON</b> to back it up or move it between machines.
        </div>
      </div>
    </div>
  </div>

<script>
"use strict";
const STORAGE_KEY = "yomu_roadmap_v1";
const STATUS = { done:"Released", now:"In progress", plan:"Planned", future:"Future" };
const KNOWN_TAGS = ["Added","Revamp","Fixed","Removed"];
const DOTCOLOR = { done:"#2EA043", now:"#E8202A", plan:"#fff", future:"#fff" };

const DEFAULT = {
  appName:"Yomu Re:Dive", subtitle:"Product Roadmap",
  footerNote:"Roadmap items are goals, not promises, and may shift.",
  footerRight:"github.com/NoMoreMora/Yomu-Redive",
  milestones:[
    { ver:"9.8.2", status:"done", title:"The Foundation + Migration Revamp (Part 1)",
      changes:[{tag:"Revamp",text:"Batch Migration"},{tag:"Fixed",text:"No black bars when swapping screen"},{tag:"Added",text:"Per-Screen Zoom Profile"},{tag:"Added",text:"Cover Art & Detail Caching"}],
      summary:"This is the starting point, with features added to improve the experience on a foldable phone for both online and offline reading." },
    { ver:"9.8.3", status:"done", title:"Migration Revamp (Part 2)",
      changes:[{tag:"Revamp",text:"Tachiyomi-style Migration screen"},{tag:"Revamp",text:"Per-candidate source search for Batch Migration"},{tag:"Revamp",text:"Advanced Migration options"},{tag:"Added",text:"Developer Options with experimental features"},{tag:"Added",text:"Auto-Translate Description (experimental)"},{tag:"Added",text:"Hide Partial Chapters (1.1, 1.2, 1.3, etc.)"},{tag:"Fixed",text:"Skip-ahead reader issue"}],
      summary:"This version largely focuses on the second part of the migration revamp, with some new features added." },
    { ver:"9.8.4", status:"now", title:"Backup Improvements (Part 1)",
      changes:[{tag:"Added",text:"Tachiyomi backup support"},{tag:"Added",text:"Error tag on the Favourites tab"},{tag:"Fixed",text:"Favourite icon only showed while browsing a source"},{tag:"Removed",text:"Check-mark icon"}],
      summary:"A smaller update that lets users migrate over from Tachiyomi while keeping their existing manga library — sources may still need to be replaced afterwards." },
    { ver:"9.9.0", status:"plan", title:"UI Restructure + More Improvements", changes:[],
      summary:"Coming up after 9.8.4 — details will be shared as this milestone approaches." },
    { ver:"9.9.1", status:"plan", title:"Additional Tracker Support", changes:[],
      summary:"Further out on the horizon." },
    { ver:"More", status:"future", title:"More to Come", changes:[],
      summary:"New ideas are in the works — the roadmap keeps growing." }
  ]
};

let state = load();

/* ---------- shared roadmap builder (preview + export) ---------- */
const el = (cls, txt) => { const d = document.createElement("div"); if (cls) d.className = cls; if (txt != null) d.textContent = txt; return d; };

function buildPage(data){
  const page = el("page");

  const head = el("head");
  head.appendChild(el("logo"));
  const hb = el();
  const app = el("app");
  const parts = String(data.appName || "").split(/\s+/);
  const first = parts.shift() || "";
  app.appendChild(document.createTextNode(first + (parts.length ? " " : "")));
  if (parts.length){ const re = document.createElement("span"); re.className = "re"; re.textContent = parts.join(" "); app.appendChild(re); }
  hb.appendChild(app);
  hb.appendChild(el("kicker", data.subtitle || ""));
  head.appendChild(hb);
  page.appendChild(head);

  const legend = el("legend");
  ["done","now","plan","future"].forEach(s => {
    const lg = el("lg"); lg.appendChild(el("ld " + s)); lg.appendChild(document.createTextNode(STATUS[s])); legend.appendChild(lg);
  });
  page.appendChild(legend);
  page.appendChild(el("rule"));

  const tl = el("timeline");
  const list = data.milestones || [];
  list.forEach((m, i) => {
    const ms = el("ms" + (i === list.length - 1 ? " last" : ""));
    if (i < list.length - 1){
      const next = list[i+1];
      let ck = "grey";
      if (m.status === "done") ck = "green";
      else if (next.status === "future") ck = "dash";
      ms.appendChild(el("conn " + ck));
    }
    ms.appendChild(el("node " + m.status));

    const card = el("card " + m.status);
    const top = el("toprow");
    top.appendChild(el("ver", m.ver));
    top.appendChild(el("chip " + m.status, STATUS[m.status]));
    card.appendChild(top);
    card.appendChild(el("title", m.title));

    const changes = (m.changes || []).filter(c => (c.tag || c.text));
    if (changes.length){
      const ch = el("changes");
      changes.forEach((c, ci) => {
        const row = el("change" + (ci === 0 ? " first" : ""));
        const tcls = KNOWN_TAGS.indexOf(c.tag) >= 0 ? c.tag : "";
        row.appendChild(el("tag " + tcls, c.tag || ""));
        row.appendChild(el("ctext", c.text || ""));
        ch.appendChild(row);
      });
      card.appendChild(ch);
    }
    if (m.summary) card.appendChild(el("summary" + (changes.length ? " divided" : ""), m.summary));

    ms.appendChild(card);
    tl.appendChild(ms);
  });
  page.appendChild(tl);

  const foot = el("foot");
  foot.appendChild(el(null, data.footerNote || ""));
  const gh = el("gh", data.footerRight || "");
  foot.appendChild(gh);
  page.appendChild(foot);

  return page;
}

/* ---------- preview ---------- */
function renderPreview(){
  const host = document.getElementById("previewHost");
  const canvas = document.getElementById("canvas");
  host.style.display = "block";
  host.innerHTML = "";
  const page = buildPage(state);
  host.appendChild(page);
  const s = canvas.clientWidth / 900;
  page.style.transformOrigin = "top left";
  page.style.transform = "scale(" + s + ")";
  canvas.style.height = (page.offsetHeight * s) + "px";
}

/* ---------- form ---------- */
function statusColorDot(s){ const d = document.createElement("span"); d.className = "ed-dot";
  if (s === "plan"){ d.style.background = "#fff"; d.style.border = "2px solid #64748B"; }
  else if (s === "future"){ d.style.background = "#fff"; d.style.border = "2px dashed #B6BCC6"; }
  else d.style.background = DOTCOLOR[s];
  return d;
}

function buildForm(){
  document.getElementById("fAppName").value = state.appName || "";
  document.getElementById("fSubtitle").value = state.subtitle || "";
  document.getElementById("fFootNote").value = state.footerNote || "";
  document.getElementById("fFootRight").value = state.footerRight || "";

  const list = document.getElementById("msList");
  list.innerHTML = "";
  state.milestones.forEach((m, i) => list.appendChild(buildMsEditor(m, i)));
}

function buildMsEditor(m, i){
  const box = document.createElement("div"); box.className = "ed-ms";

  const head = document.createElement("div"); head.className = "ed-ms-head";
  head.appendChild(statusColorDot(m.status));
  const t = document.createElement("div"); t.className = "ed-ms-title"; t.textContent = (m.ver || "—") + "  " + (m.title || "");
  head.appendChild(t);
  const tools = document.createElement("div"); tools.className = "ed-ms-tools";
  tools.appendChild(iconBtn("↑", "Move up", () => { move(i, -1); }));
  tools.appendChild(iconBtn("↓", "Move down", () => { move(i, 1); }));
  const del = iconBtn("✕", "Delete", () => { state.milestones.splice(i,1); commit(true); }); del.classList.add("del");
  tools.appendChild(del);
  head.appendChild(tools);
  box.appendChild(head);

  box.appendChild(field2(
    inputField("Version", m.ver, v => { m.ver = v; t.textContent = (m.ver||"—")+"  "+(m.title||""); softCommit(); }),
    selectField("Status", ["done","now","plan","future"], s => STATUS[s], m.status, v => {
      m.status = v; head.replaceChild(statusColorDot(v), head.firstChild); softCommit();
    })
  ));
  box.appendChild(inputField("Title", m.title, v => { m.title = v; t.textContent = (m.ver||"—")+"  "+(m.title||""); softCommit(); }));

  const cl = document.createElement("div"); cl.className = "ed-changes";
  const clab = document.createElement("div"); clab.className = "ed-clabel"; clab.textContent = "Changes"; cl.appendChild(clab);
  m.changes = m.changes || [];
  m.changes.forEach((c, ci) => cl.appendChild(changeRow(m, c, ci)));
  const add = document.createElement("button"); add.className = "ed-addchange"; add.textContent = "＋ Add change";
  add.onclick = () => { m.changes.push({ tag:"Added", text:"" }); commit(true); };
  cl.appendChild(add);
  box.appendChild(cl);

  box.appendChild(textareaField("Summary", m.summary, v => { m.summary = v; softCommit(); }));
  return box;
}

function changeRow(m, c, ci){
  const row = document.createElement("div"); row.className = "ed-change";
  const sel = document.createElement("select");
  KNOWN_TAGS.concat(["Custom…"]).forEach(tg => { const o = document.createElement("option"); o.value = tg; o.textContent = tg; sel.appendChild(o); });
  sel.value = KNOWN_TAGS.indexOf(c.tag) >= 0 ? c.tag : "Custom…";
  const txt = document.createElement("input"); txt.value = c.text || ""; txt.placeholder = "Change description";
  const tagText = document.createElement("input"); tagText.value = c.tag || ""; tagText.placeholder = "Tag";
  tagText.style.display = sel.value === "Custom…" ? "block" : "none";
  sel.onchange = () => {
    if (sel.value === "Custom…"){ tagText.style.display = "block"; c.tag = tagText.value || ""; }
    else { tagText.style.display = "none"; c.tag = sel.value; }
    softCommit();
  };
  tagText.oninput = () => { c.tag = tagText.value; softCommit(); };
  txt.oninput = () => { c.text = txt.value; softCommit(); };
  const del = iconBtn("✕", "Remove change", () => { m.changes.splice(ci,1); commit(true); }); del.classList.add("del");
  // layout: [select or custom tag input] [text] [del]
  const tagCell = document.createElement("div");
  tagCell.appendChild(sel); tagCell.appendChild(tagText);
  row.appendChild(tagCell); row.appendChild(txt); row.appendChild(del);
  return row;
}

/* ---------- small field helpers ---------- */
function inputField(label, val, on){
  const f = document.createElement("div"); f.className = "ed-field";
  const l = document.createElement("label"); l.textContent = label; f.appendChild(l);
  const inp = document.createElement("input"); inp.value = val || ""; inp.oninput = () => on(inp.value); f.appendChild(inp);
  return f;
}
function textareaField(label, val, on){
  const f = document.createElement("div"); f.className = "ed-field";
  const l = document.createElement("label"); l.textContent = label; f.appendChild(l);
  const ta = document.createElement("textarea"); ta.value = val || ""; ta.oninput = () => on(ta.value); f.appendChild(ta);
  return f;
}
function selectField(label, opts, labeler, val, on){
  const f = document.createElement("div"); f.className = "ed-field";
  const l = document.createElement("label"); l.textContent = label; f.appendChild(l);
  const s = document.createElement("select");
  opts.forEach(o => { const op = document.createElement("option"); op.value = o; op.textContent = labeler(o); s.appendChild(op); });
  s.value = val; s.onchange = () => on(s.value); f.appendChild(s);
  return f;
}
function field2(a, b){ const w = document.createElement("div"); w.className = "ed-row2"; w.appendChild(a); w.appendChild(b); return w; }
function iconBtn(txt, title, on){ const b = document.createElement("button"); b.className = "ed-icon"; b.textContent = txt; b.title = title; b.onclick = on; return b; }

/* ---------- state plumbing ---------- */
function move(i, d){ const j = i + d; if (j < 0 || j >= state.milestones.length) return;
  const a = state.milestones; [a[i], a[j]] = [a[j], a[i]]; commit(true); }
function softCommit(){ renderPreview(); save(); }            // typing: preview + save only
function commit(rebuild){ if (rebuild) buildForm(); renderPreview(); save(); }  // structural change
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); flash("Saved"); }catch(e){} }
function load(){ try{ const s = localStorage.getItem(STORAGE_KEY); if (s) return JSON.parse(s); }catch(e){} return clone(DEFAULT); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
let flashT; function flash(msg){ const s = document.getElementById("status"); if(!s) return; s.textContent = msg; clearTimeout(flashT); flashT = setTimeout(() => s.textContent = "", 1200); }

/* header/footer inputs */
["fAppName","appName"],["fSubtitle","subtitle"],["fFootNote","footerNote"],["fFootRight","footerRight"];
function bindGlobals(){
  const map = { fAppName:"appName", fSubtitle:"subtitle", fFootNote:"footerNote", fFootRight:"footerRight" };
  Object.keys(map).forEach(id => { document.getElementById(id).oninput = e => { state[map[id]] = e.target.value; softCommit(); }; });
}

/* ---------- export ---------- */
function download(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

function currentCss(){
  // pull just the roadmap rules (everything before the editor-chrome marker comment) — simplest: use the whole sheet;
  // .ed-* rules are harmless inside the exported SVG since no .ed-* nodes exist there.
  let css = "";
  for (const sheet of document.styleSheets){
    try { for (const rule of sheet.cssRules) css += rule.cssText + "\n"; } catch(e){}
  }
  return css;
}

function exportPNG(){
  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;left:-99999px;top:0;";
  const page = buildPage(state);
  holder.appendChild(page); document.body.appendChild(holder);
  const w = page.offsetWidth, h = page.offsetHeight;
  const css = currentCss();
  const xhtml = new XMLSerializer().serializeToString(page);
  document.body.removeChild(holder);

  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
              '<foreignObject width="' + w + '" height="' + h + '">' +
              '<div xmlns="http://www.w3.org/1999/xhtml"><style>' + css + '</style>' + xhtml + '</div>' +
              '</foreignObject></svg>';

  const scale = 2;
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = w * scale; canvas.height = h * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FAFBFC"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(b => { if (b) download(b, "roadmap.png"); else alert("PNG export failed — try Chrome or Edge."); }, "image/png");
  };
  img.onerror = () => alert("PNG export failed in this browser. Try Chrome/Edge, or use the HTML export and screenshot it.");
  img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
}

function exportHTML(){
  const page = buildPage(state);
  const html = "<!doctype html>\n<html><head><meta charset=\"utf-8\"><title>" +
    (state.appName || "Roadmap") + " — Roadmap</title>\n<style>\n" + currentCss() +
    "\nhtml,body{margin:0;background:#FAFBFC;}\n</style></head>\n<body>\n" +
    page.outerHTML + "\n</body></html>";
  download(new Blob([html], { type:"text/html" }), "roadmap.html");
}

function exportJSON(){ download(new Blob([JSON.stringify(state, null, 2)], { type:"application/json" }), "roadmap.json"); }

/* ---------- wire up ---------- */
document.getElementById("btnPng").onclick = exportPNG;
document.getElementById("btnHtml").onclick = exportHTML;
document.getElementById("btnJson").onclick = exportJSON;
document.getElementById("btnReset").onclick = () => { if (confirm("Reset to the built-in default roadmap? Your current edits will be lost.")){ state = clone(DEFAULT); commit(true); } };
document.getElementById("btnAdd").onclick = () => { state.milestones.push({ ver:"", status:"plan", title:"New milestone", changes:[], summary:"" }); commit(true); };
document.getElementById("btnImport").onclick = () => document.getElementById("fileJson").click();
document.getElementById("fileJson").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => { try { const obj = JSON.parse(r.result); if (!obj.milestones) throw 0; state = obj; commit(true); flash("Imported"); }
    catch(err){ alert("That doesn't look like a valid roadmap JSON file."); } };
  r.readAsText(file); e.target.value = "";
};
window.addEventListener("resize", renderPreview);

bindGlobals();
buildForm();
renderPreview();
</script>
</body>
</html>
