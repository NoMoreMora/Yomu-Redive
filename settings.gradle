pluginManagement {
	repositories {
		google {
			content {
				includeGroupByRegex("com\\.android.*")
				includeGroupByRegex("com\\.google.*")
				includeGroupByRegex("androidx.*")
			}
		}
		mavenCentral()
		gradlePluginPortal()
		maven {
			url 'https://jitpack.io'
			content {
				includeGroupByRegex("com\\.github.*")
			}
		}
	}
}
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
		maven {
			url 'https://jitpack.io'
		}
	}
}

// Parser development (Path 3): when a local clone of the parsers fork sits next to this project,
// build against it directly for instant edits. On a clean machine / CI the folder is absent, so
// the app falls back to the JitPack dependency (com.github.NoMoreMora:yomu-redive-parsers).
def localParsers = file('../yomu-redive-parsers')
if (localParsers.exists()) {
	includeBuild(localParsers) {
		dependencySubstitution {
			substitute module('com.github.NoMoreMora:yomu-redive-parsers') using project(':')
		}
	}
}

include ':app'
rootProject.name = "Yomu-Redive"
